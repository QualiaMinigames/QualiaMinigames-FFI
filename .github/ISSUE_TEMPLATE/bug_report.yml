name: Bug Report - Bug反馈
description: Create a report to help us improve. - 反馈问题，帮助我们改进
title: "[Bug] "
labels:
  - 🐛 Bug

body:
  - type: markdown
    attributes:
      value: |
        Before filling in this `issue`, please make sure that there are no similar or duplicate `issues` that have been opened.
        填写此 `issue` 前，请先确认已经开启的 `issue` 没有类似或重复的 `issue`。

  - type: input
    id: version
    attributes:
      label: Version Details - 版本信息
      description: |
        What version of `qualia-minigames-ffi` do you use? If the problem is a wrong board rather than a wrong binding, it belongs to the core crate instead: this crate carries the rules across a boundary, it does not decide them.
        你使用的 `qualia-minigames-ffi` 版本是什么？如果问题是盘面本身算错而非绑定层出错，它属于 core crate：本 crate 只把规则送过边界，不决定规则。
      placeholder: qualia-minigames-ffi version
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Target Platform - 目标平台
      description: |
        Which platform do you build the bindings for?
        你为哪个平台构建绑定？
      options:
        - Android
        - Linux
        - Windows
        - MacOS
        - iOS
        - Other / 其他
    validations:
      required: true

  - type: input
    id: uniffi_version
    attributes:
      label: UniFFI Version - UniFFI 版本
      description: |
        What is the output of `uniffi-bindgen --version`? The bindings are generated by one version and must be consumed by the same one.
        `uniffi-bindgen --version` 的输出是什么？绑定由某个版本生成，也必须由同一版本消费。
      placeholder: e.g. uniffi-bindgen 0.32.2
    validations:
      required: true

  - type: textarea
    id: exist
    attributes:
      label: Existing behavior - 现有行为
      description: |
        Please describe the problem you have encountered carefully. State whether it is the generated Kotlin, the generated header, the library load, or a value that comes back wrong from a call, and include the language you call it from.
        请仔细描述你所遇到的问题。请说明问题出在生成的 Kotlin、生成的 C 头、动态库加载，还是某次调用返回了错误的值，并注明你从哪种语言调用。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: Expected behavior - 预期行为
      description: |
        Please describe in detail the results you wish to achieve.
        请仔细描述你要得到的结果。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce - 复现问题
      description: |
        How do you trigger this bug? Please walk us through it step by step, including the build command and the call that fails.
        这个 bug 是怎么触发的？请一步一步详细告诉我们是怎样出现这个情况的，包含构建命令与失败的调用。
    validations:
      required: false

  - type: checkboxes
    id: know
    attributes:
      label: Checks - 检查项
      options:
        - label: I have searched the [issue tracker](https://github.com/QualiaMinigames/QualiaMinigames-FFI/issues) and confirmed that there is no identical issue. 我已经搜索[问题追踪器](https://github.com/QualiaMinigames/QualiaMinigames-FFI/issues)并且确认没有相同的 Issue。
          required: true
        - label: I admit that I previously checked all options without thorough verification and directly submitted this Issue, and I agree that it can be closed directly. 我承认此前未充分核实便勾选了所有选项并直接提交此 Issue ，且同意该 Issue 可被直接关闭。
        - label: I confirm that I am currently using the latest release of `qualia-minigames-ffi`. If not, this issue can be closed directly. 我确认当前使用的是 `qualia-minigames-ffi` 的最新版本，若非如此，此 Issue 可被直接关闭。
          required: true
        - label: I promise to provide a detailed description of the encountered issue, along with the failing call, rather than offering incomplete or vague information. 我承诺将详细描述遇到的问题，并提供失败的调用，而非提供不完整或模糊的信息。
          required: true
