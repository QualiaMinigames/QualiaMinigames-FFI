name: CI

# This crate moves values between the core and a foreign language, so the gates are the
# ones a binding layer needs: the usual fmt/clippy/test, the MSRV declaration, the
# dependency audit, and a check that the bindings still generate. A binding layer that
# compiles but cannot generate its bindings is broken for every front end.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain (channel from rust-toolchain.toml)
        run: rustup show

      - name: Cache the build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo doc
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # The bindings are what a front end consumes, so their generation is part of what this
      # workflow verifies. The generated file is not committed; it is a build product of the
      # library this job has just built.
      #
      # `--config` is deliberately not passed. `uniffi.toml` beside the crate is read by the
      # generator on its own, and passing it explicitly now takes the flag as a global config
      # file, which a crate-local one is not: it warns that the file is in the old flat format.
      # The package it declares is checked instead, from the file that was actually written.
      #
      # The output path is found rather than written down. UniFFI lays the file out under that
      # package name, and the step used to assert the path the name produced before it was set:
      # the check then failed on a generation that had in fact succeeded, which is a gate that
      # reports the opposite of what it means.
      - name: Generate the Kotlin bindings
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          cargo install uniffi --version 0.32.2 --features cli --locked
          uniffi-bindgen generate --library target/release/qualia_minigames_ffi.dll \
            --language kotlin --out-dir build/bindings --no-format
          mapfile -t generated < <(find build/bindings -name 'qualia_minigames_ffi.kt' -type f)
          if [ "${#generated[@]}" -ne 1 ]; then
            echo "::error::expected one qualia_minigames_ffi.kt under build/bindings, found ${#generated[@]}"
            find build/bindings -type f
            exit 1
          fi
          if [ ! -s "${generated[0]}" ]; then
            echo "::error::${generated[0]} is empty"
            exit 1
          fi
          # The package the file declares is the one a front end imports. A mismatch is a
          # binding every front end would fail to resolve, and no other gate here sees it.
          if ! grep -q '^package com\.qiushui1012\.app\.minigames\.ffi' "${generated[0]}"; then
            echo "::error::${generated[0]} does not declare the package uniffi.toml asks for"
            head -n 5 "${generated[0]}"
            exit 1
          fi
          echo "The Kotlin bindings were generated at ${generated[0]}."

  msrv:
    name: MSRV 1.89
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the 1.89 toolchain
        run: rustup toolchain install 1.89 --profile minimal

      - name: Compile with 1.89
        run: cargo +1.89 check --all-targets

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
